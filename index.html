    <script>
      (function() {
        if (typeof window !== 'undefined') {
          window.addEventListener('unhandledrejection', function(event) {
            var reasonStr = (event && (event.reason ? (event.reason.message || String(event.reason)) : '')) || '';
            if (
              reasonStr.indexOf('WebSocket') !== -1 ||
              reasonStr.indexOf('websocket') !== -1
            ) {
              if (event.preventDefault) event.preventDefault();
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
              return true;
            }
          }, true);
        }
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : null;
          var activeFetch = originalFetch;
          var targets = [window];
          if (typeof Window !== 'undefined' && Window.prototype) {
            targets.push(Window.prototype);
          }
          if (typeof globalThis !== 'undefined' && globalThis !== window) {
            targets.push(globalThis);
          }
          for (var i = 0; i < targets.length; i++) {
            try {
              Object.defineProperty(targets[i], 'fetch', {
                configurable: true,
                enumerable: true,
                get: function() {
                  return activeFetch || originalFetch;
                },
                set: function(newFetch) {
                  activeFetch = newFetch;
                }
              });
            } catch (err) {}
          }
        } catch (e) {}
      })();
    </script>
